name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux and macOS are the shipped platforms; macOS has its own code paths
    # (state directory location, file locking, detached background runs).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'make fmt' to fix."
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./... && go vet -tags e2e ./e2e/

      - name: Build
        run: go build ./...

      - name: Cross-build for Windows (not shipped yet; keeps it compiling)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=amd64 go vet ./... && GOOS=windows GOARCH=amd64 go build ./...

      # The race detector matters here: hooks run concurrently and share files
      # through locks, and processing runs in a detached background process.
      - name: Test
        run: go test -race ./...

  package:
    # Builds the npm packages and installs them with npm and pnpm, as the
    # release does, so packaging breaks here rather than at release time.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g pnpm@10.33.2

      - name: Build and smoke-test the npm packages
        run: make npm-smoke-test VERSION=0.0.0-ci
