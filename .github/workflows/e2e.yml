name: E2E

# Runs a real coding agent against a real repository with swarmia-cli's hooks
# installed, and checks what swarmia-cli captured, attributed and would send.
# See docs/e2e.md.

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude Code version or npm dist-tag (latest, stable, 2.1.292, …)"
        default: "latest"
      model:
        description: "Model for the agent (alias or full name)"
        default: "sonnet"

permissions:
  contents: read
  id-token: write # workload identity federation with Anthropic

jobs:
  claude-code:
    name: Claude Code ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        # Nightly: the newest release and the stable channel, which separates
        # "Claude Code changed" from "we broke something". On demand: the one asked for.
        version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.claude_version) || '["latest","stable"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Anthropic federation rule trusts only this environment's OIDC subject
    # (repo:swarmia/swarmia-cli:environment:e2e), and the environment only
    # allows the main branch, so no other branch or fork can spend tokens.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run the end-to-end suite
        env:
          E2E_CLAUDE_VERSION: ${{ matrix.version }}
          E2E_MODEL: ${{ inputs.model || 'sonnet' }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
          E2E_REQUIRE_AUTH: "1"
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: make e2e

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-claude-code-${{ matrix.version }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
